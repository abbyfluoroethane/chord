[package]
name = "chord-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Allows CHORD_SERVER=tcp://host:port (no TLS). Off by default.
# Build with: cargo build -p chord-cli --features dev-insecure
dev-insecure = ["chord-core/dev-insecure"]

[dependencies]
chord-core.workspace = true
log.workspace = true
# Local times in the human output. xmpp-parsers depends on it already.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
