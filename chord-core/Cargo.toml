[package]
name = "chord-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["native-session"]
# The tokio-xmpp session. Turn it off for the wasm32 build.
native-session = ["dep:tokio-xmpp", "dep:tokio", "dep:sasl"]
# Plain TCP to a dev server (ServerAddr::InsecureTcp). Off by default.
# chord-ffi and release builds must never enable it. CI checks this.
dev-insecure = ["native-session", "tokio-xmpp/insecure-tcp"]

[dependencies]
xmpp-parsers.workspace = true
jid.workspace = true
futures-core.workspace = true
rusqlite.workspace = true
log.workspace = true
sasl = { workspace = true, optional = true }
tokio-xmpp = { workspace = true, optional = true }
# Only session/native.rs and runtime.rs use tokio.
tokio = { workspace = true, optional = true, features = ["sync", "rt", "macros", "time"] }

[dev-dependencies]
# Paused time for the retry loop tests in session/native.rs.
tokio = { workspace = true, features = ["test-util", "macros", "rt", "time", "sync"] }
