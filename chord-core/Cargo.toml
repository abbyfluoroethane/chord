[package]
name = "chord-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["native-session"]
# The tokio-xmpp session. Turn it off for the wasm32 build.
native-session = ["dep:tokio-xmpp", "dep:tokio", "dep:sasl", "dep:reqwest", "dep:futures-util"]
# Plain TCP to a dev server (ServerAddr::InsecureTcp). Off by default.
# chord-ffi and release builds must never enable it. CI checks this.
dev-insecure = ["native-session", "tokio-xmpp/insecure-tcp"]

# JSON output for the desktop app: Serialize on the view items and events, Deserialize on
# the values that the UI sends back. Off by default. The wasm and FFI builds leave it off.
serde = ["dep:serde", "jid/serde"]

[dependencies]
xmpp-parsers.workspace = true
sha1.workspace = true
# The SHA-256 of an uploaded file (XEP-0446).
sha2 = "0.10"
jid.workspace = true
futures-core.workspace = true
rusqlite.workspace = true
log.workspace = true
serde = { version = "1", features = ["derive"], optional = true }
futures-channel.workspace = true
uuid.workspace = true
sasl = { workspace = true, optional = true }
tokio-xmpp = { workspace = true, optional = true }
# Sink and Stream helpers for the stream of session/register.rs.
futures-util = { version = "0.3", optional = true, default-features = false, features = ["sink", "std"] }
# Only session/native.rs and runtime.rs use tokio.
tokio = { workspace = true, optional = true, features = ["sync", "rt", "macros", "time", "io-util", "net"] }

# HTTP PUT for XEP-0363 upload. Only runtime-gated code in features/upload.rs uses it.
reqwest = { version = "0.13", optional = true, default-features = false, features = ["rustls", "stream"] }

# xmpp-parsers and xso use uuid. On wasm32-unknown-unknown it needs a JS randomness source.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["js"] }

[dev-dependencies]
# Paused time for the retry loop tests in session/native.rs.
tokio = { workspace = true, features = ["test-util", "macros", "rt", "time", "sync"] }

# The JSON snapshot test of the serde feature (tests/serde_json.rs).
serde_json = "1"
