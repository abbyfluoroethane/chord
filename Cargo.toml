[workspace]
resolver = "3"
members = ["chord-core", "chord-ffi", "chord-cli", "chord-desktop/src-tauri"]
# A plain `cargo build` skips the desktop app. It needs WebKitGTK on Linux.
default-members = ["chord-core", "chord-ffi", "chord-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
chord-core = { path = "chord-core" }
# Exact pin: tokio-xmpp changes its API often. See the Core spec.
tokio-xmpp = { version = "=6.0.0" }
xmpp-parsers = "0.23"
jid = "0.12"
# The Stream trait for Session::events. Also works on wasm32.
futures-core = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = "1"
# SASL credentials and channel binding for the login in session/native.rs.
# Same version as tokio-xmpp 6.0.0 uses.
sasl = "0.5"
# Logging facade. tokio-xmpp logs through it too.
log = "0.4"
# Channels for the actor. No tokio, so they also work on wasm32.
futures-channel = "0.3"
# XEP-0359 origin-ids. xmpp-parsers already depends on it with v4.
uuid = { version = "1", features = ["v4"] }
# SHA-1 of avatar images (XEP-0084). xmpp-parsers already depends on this version.
sha1 = "0.11"

# tokio-xmpp 6.0.0 with patches. See the "CHORD PATCH" comments in vendor/tokio-xmpp.
# - `StanzaStream::send_client_state` sends the XEP-0352 `<active/>` and `<inactive/>`
#   nonzas. Upstream sends nothing but stanzas.
# - `DnsConfig::srv_records` returns the SRV records, and
#   `establish_tls_connection_with_alpn` sets the ALPN protocol of XEP-0368 direct TLS.
# - `CertCheck` and `establish_tls_connection_with` (connect/tls_common.rs) and
#   `starttls_checked` (connect/starttls.rs) check the server certificate after the TLS
#   handshake, for the certificate pin (SECURITYAUTH-13). Both STARTTLS and direct TLS use it.
#   The check also sits in a verifier that wraps the normal one (`PinnedVerifier`). It
#   sees a refused certificate, and it lets exactly one certificate pass that the user
#   chose to trust (CORESESSION-15). It never turns the validation off.
# - The stanza worker answers an IQ get or set that fails to parse with a bad-request
#   error (RFC 6120, 8.2.3). Upstream drops it without a reply.
# Drop these when upstream gets an API for them.
[patch.crates-io]
tokio-xmpp = { path = "vendor/tokio-xmpp" }

# panic = "unwind" is required. Do not set panic = "abort" in any profile.
#
# - UniFFI needs unwind to turn a panic into an error at the FFI boundary.
# - tokio-xmpp 6.0.0 panics in stanzastream/worker.rs:549 when a connector drops its
#   slot. Chord never drops the slot (see release_slot in
#   chord-core/src/session/native.rs), but if that ever breaks, tokio catches the panic
#   only with unwind. With abort, the panic stops the whole process.
# - Tauri size guides recommend panic = "abort". Do not copy that.
[profile.dev]
panic = "unwind"
# Line tables keep file and line numbers in panics and backtraces. Full debug info made
# target/ grow to 25 GB and fill the disk during parallel builds.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
panic = "unwind"
# Size and speed of the release build. The desktop app and chord-cli use it. The cost is a
# longer build, and the cost is only in release.
# - lto = "fat" optimizes across all crates. It removes dead code from tokio, rustls,
#   hyper and sqlite glue, so the binary gets smaller and calls get faster.
# - codegen-units = 1 gives the optimizer one view of each crate. It makes the build slower
#   because it cannot run in parallel.
# - strip = "symbols" removes the symbol table from the binary. A panic still prints its
#   message and its location, but a backtrace shows addresses instead of function names.
# - opt-level stays at 3. "s" or "z" make the binary smaller but slow down parsing and SQL.
# - debug stays off in release, which is the default.
lto = "fat"
codegen-units = 1
strip = "symbols"
