[workspace]
resolver = "3"
members = ["chord-core", "chord-ffi", "chord-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
chord-core = { path = "chord-core" }
# Exact pin: tokio-xmpp changes its API often. See the Core spec.
tokio-xmpp = { version = "=6.0.0" }
xmpp-parsers = "0.23"
jid = "0.12"
# The Stream trait for Session::events. Also works on wasm32.
futures-core = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = "1"
# SASL credentials and channel binding for the login in session/native.rs.
# Same version as tokio-xmpp 6.0.0 uses.
sasl = "0.5"
# Logging facade. tokio-xmpp logs through it too.
log = "0.4"
# Channels for the actor. No tokio, so they also work on wasm32.
futures-channel = "0.3"
# XEP-0359 origin-ids. xmpp-parsers already depends on it with v4.
uuid = { version = "1", features = ["v4"] }

# panic = "unwind" is required. Do not set panic = "abort" in any profile.
#
# - UniFFI needs unwind to turn a panic into an error at the FFI boundary.
# - tokio-xmpp 6.0.0 panics in stanzastream/worker.rs:549 when a connector drops its
#   slot. Chord never drops the slot (see release_slot in
#   chord-core/src/session/native.rs), but if that ever breaks, tokio catches the panic
#   only with unwind. With abort, the panic stops the whole process.
# - Tauri size guides recommend panic = "abort". Do not copy that.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
