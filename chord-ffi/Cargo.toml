[package]
name = "chord-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
# Default features only. chord-ffi must never enable dev-insecure. CI checks this.
chord-core.workspace = true
# Bindings generator. Proc-macros only, no UDL. "cli" builds the uniffi-bindgen binary.
# "tokio" gives #[uniffi::export(async_runtime = "tokio")].
uniffi = { version = "0.32", features = ["cli", "tokio"] }
# The client owns a multi-thread runtime for the actor and the session.
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros"] }
futures-core.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
