[package]
name = "chord-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
# Default features only. chord-ffi must never enable dev-insecure. CI checks this.
chord-core.workspace = true
# Bindings generator. Proc-macros only, no UDL. "cli" builds the uniffi-bindgen binary.
# "tokio" gives #[uniffi::export(async_runtime = "tokio")].
uniffi = { version = "0.32", features = ["cli", "tokio"] }
# The client owns a multi-thread runtime for the actor and the session.
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros"] }
futures-core.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

# Android only: the JNI entry point that initialises rustls-platform-verifier (src/android.rs).
# Both crates are already in the tree through reqwest. Keep the versions equal to its.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", default-features = false }
rustls-platform-verifier = "0.7"
# hickory-resolver (SRV lookups of tokio-xmpp) reads the Android DNS servers through it.
ndk-context = "0.1"
# The same HTTP client as the upload in chord-core. Only the diagnostic probe uses it.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
