[package]
name = "chord-omemo"
version.workspace = true
edition.workspace = true
# The crate links libomemo-c (GPL-3.0). Its own Rust files are MIT.
license = "GPL-3.0-only"
description = "OMEMO 2 (XEP-0384) for Chord: a safe wrapper around the vendored libomemo-c (GPL-3.0), plus the payload encryption. No XMPP and no I/O."

[dependencies]
aes = "0.9.3"
cbc = { version = "0.2.1", features = ["alloc"] }
ctr = "0.10.1"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
sha2 = "0.11.0"
zeroize = "1.9.0"

[build-dependencies]
cc = "1.5"

[dev-dependencies]
hex = "0.4.3"
serde_json = "1.0.151"
