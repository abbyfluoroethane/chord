[package]
name = "chord-omemo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OMEMO 2 (XEP-0384) for Chord in pure Rust: X3DH and the Double Ratchet from a fork of vodozemac (Apache-2.0), plus the payload encryption. No XMPP and no I/O."

[dependencies]
aes = "0.9.3"
arrayvec = { version = "0.7.8", features = ["serde"] }
cbc = { version = "0.2.1", features = ["alloc"] }
curve25519-dalek = { version = "5.0.0", default-features = false, features = ["zeroize"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize", "hazmat"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
x25519-dalek = { version = "3.0.0", default-features = false, features = ["serde", "static_secrets", "zeroize"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
hex = "0.4.3"
