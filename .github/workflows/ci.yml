name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Integration tests are #[ignore], so `cargo test` in the native job skips them.
# The integration job starts the Docker Prosody server (dev/prosody/) and runs them.

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # chord-desktop needs the WebKitGTK libraries. The desktop job builds it.
      - run: cargo build --workspace --exclude chord-desktop
      - run: cargo clippy --workspace --exclude chord-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude chord-desktop
      - name: Generate the Kotlin bindings
        run: ./dev/ffi-bindgen-check.sh

  # The Tauri desktop app: the Svelte front end, then the Rust side.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chord-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build the front end
        working-directory: chord-desktop
        run: |
          npm ci
          npm run check
          npm run build
      - run: cargo clippy -p chord-desktop --all-targets -- -D warnings
      - run: cargo test -p chord-desktop

  # Compile the generated Kotlin bindings and run a small offline smoke program.
  # dev/ffi-bindgen-check.sh downloads kotlinc, JNA and kotlinx-coroutines.
  # It checks each download against a pinned sha256.
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile and run the Kotlin smoke test
        env:
          CHORD_KOTLIN_FETCH: "1"
          CHORD_KOTLIN_REQUIRE: "1"
        run: ./dev/ffi-bindgen-check.sh

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p chord-core --target wasm32-unknown-unknown --no-default-features

  ffi-no-dev-insecure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check that default builds exclude dev-insecure and insecure-tcp
        run: ./dev/check-features.sh

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install mkcert
        run: sudo apt-get update && sudo apt-get install -y mkcert
      - name: Start the Prosody test server
        run: |
          printf 'ALICE_PASSWORD=%s\nBOB_PASSWORD=%s\n' "$(openssl rand -hex 12)" "$(openssl rand -hex 12)" > dev/prosody/.env
          ./dev/prosody/setup.sh
      - name: Trust the mkcert CA for this job
        # rustls-native-certs reads SSL_CERT_FILE in place of the system trust store.
        run: echo "SSL_CERT_FILE=$(mkcert -CAROOT)/rootCA.pem" >> "$GITHUB_ENV"
      - name: Integration tests
        run: cargo test --workspace --exclude chord-desktop -- --ignored
      - name: Alice sends to bob over TLS
        run: ./dev/send-demo.sh
      - name: End-to-end run through chord-cli
        run: ./dev/e2e-demo.sh
      - name: Server log
        if: failure()
        run: docker compose -f dev/prosody/docker-compose.yml logs --tail 200
