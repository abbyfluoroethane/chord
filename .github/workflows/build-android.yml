name: Build Android

# Builds the signed release APKs for a version. nightly.yml calls it. Leaves an artifact
# "android" with chord-android-<version>-<abi>.apk.
#
# Secrets: ANDROID_KEYSTORE_BASE64 (the keystore file, base64), CHORD_KEYSTORE_PASSWORD,
# CHORD_KEY_ALIAS, CHORD_KEY_PASSWORD. The key is the one dev/release.sh uses: a phone only
# updates from an APK signed with the same key.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CHORD_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 platforms;android-37.0 build-tools;36.1.0 ndk;29.0.14206865"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - uses: gradle/actions/setup-gradle@v4
      - name: The signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [[ -n "$KEYSTORE" ]] || { echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing."; exit 1; }
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CHORD_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        working-directory: chord-android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          CHORD_KEYSTORE_PASSWORD: ${{ secrets.CHORD_KEYSTORE_PASSWORD }}
          CHORD_KEY_ALIAS: ${{ secrets.CHORD_KEY_ALIAS }}
          CHORD_KEY_PASSWORD: ${{ secrets.CHORD_KEY_PASSWORD }}
        run: ./gradlew --console=plain assembleRelease "-Pchord.version=$CHORD_VERSION"
      - name: Collect the APKs
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/release.jks"
          mkdir dist
          for abi in arm64-v8a x86_64 universal; do
            cp "chord-android/app/build/outputs/apk/release/app-$abi-release.apk" "dist/chord-android-$CHORD_VERSION-$abi.apk"
          done
          # The manifest's build number must be the versionCode, or phones update in a loop.
          code=$("$ANDROID_HOME/build-tools/36.1.0/aapt2" dump badging "dist/chord-android-$CHORD_VERSION-universal.apk" \
            | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          want=$(dev/releases.py build-number "$CHORD_VERSION")
          [[ "$code" == "$want" ]] || { echo "::error::versionCode $code, expected $want"; exit 1; }
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error
