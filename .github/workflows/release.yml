name: Release

# A tag desktop-v<version> builds the desktop app on Linux, Windows and macOS, publishes it to
# the release repository abbyfluoroethane/chord-desktop, and updates the channel manifests for
# the in-app updater. dev/release.sh makes the tag. Android releases are built and published by
# dev/release.sh. See docs/releasing.md and docs/updates.md.
#
# "Run workflow" builds without a tag and without publishing, to check the build.
#
# Secrets:
#   CHORD_RELEASES_TOKEN   A fine-grained token with "Contents: read and write" on the release
#                    repositories only. GITHUB_TOKEN cannot write to another repository.
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD   The updater key.
#   CHORD_KLIPY_KEY  The GIF search key (docs/gifs.md). Without it, GIF search is off.

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, for example 0.3.0-beta.1. Nothing is published."
        required: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version="${REF_NAME#desktop-v}"; publish=true
          else
            version="$INPUT_VERSION"; publish=false
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.([1-9][0-9]*))?$ ]]; then
            echo "::error::$version is not MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-beta.N"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build-desktop.yml
    with:
      version: ${{ needs.version.outputs.version }}
      platforms: '["ubuntu-22.04","windows-latest","macos-latest"]'
    secrets: inherit

  publish:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Publish to abbyfluoroethane/chord-desktop
        env:
          GH_TOKEN: ${{ secrets.CHORD_RELEASES_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo "::error::The CHORD_RELEASES_TOKEN secret is missing."; exit 1; }
          repo=abbyfluoroethane/chord-desktop
          commit=$(git rev-parse --short HEAD)
          channel=stable; release_tag="v$VERSION"; flags=(--latest)
          if [[ "$VERSION" == *-beta.* ]]; then
            channel=beta; release_tag="v$VERSION+$commit"; flags=(--prerelease)
          fi
          encoded=$(printf '%s' "$release_tag" | sed 's/+/%2B/g')
          # The notes are the message of the annotated tag that dev/release.sh made.
          git for-each-ref --format='%(contents:body)' "refs/tags/$TAG" > app-notes.md
          mkdir assets
          find dist -type f ! -name 'updater-*.json' -exec cp {} assets/ \;
          (cd assets && sha256sum -- * > SHA256SUMS)
          {
            cat app-notes.md
            echo
            echo "Linux: .AppImage, .deb or .rpm. Windows: the -setup.exe. macOS (Apple silicon): the .dmg."
            echo
            echo '```'
            cat assets/SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$release_tag" -R "$repo" --title "Chord Desktop $VERSION" --notes-file notes.md "${flags[@]}" assets/*
          dev/releases.py desktop-manifests "$VERSION" HEAD "https://github.com/$repo/releases/tag/$encoded" \
            "https://github.com/$repo/releases/download/$encoded" app-notes.md dist manifests
          dev/releases.py publish desktop "$channel" manifests
