name: Release

# A tag desktop-v<version> builds the desktop app on Linux, Windows and macOS and publishes it to
# the release repository abbyfluoroethane/chord-desktop. dev/release.sh makes the tag.
# Android releases are built and published by dev/release.sh on a machine with the signing key.
# See docs/releasing.md.
#
# "Run workflow" builds without a tag and without publishing, to check the build.
#
# Secrets:
#   RELEASES_TOKEN   A fine-grained token with "Contents: read and write" on the release
#                    repositories only. GITHUB_TOKEN cannot write to another repository.
#   CHORD_KLIPY_KEY  The GIF search key (docs/gifs.md). Without it, GIF search is off.

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, for example 0.3.0-beta.1. Nothing is published."
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      beta: ${{ steps.v.outputs.beta }}
      commit: ${{ steps.v.outputs.commit }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version="${REF_NAME#desktop-v}"; publish=true
          else
            version="$INPUT_VERSION"; publish=false
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.([1-9][0-9]*))?$ ]]; then
            echo "::error::$version is not MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-beta.N"; exit 1
          fi
          beta=false; [[ "$version" == *-beta.* ]] && beta=true
          {
            echo "version=$version"
            echo "beta=$beta"
            echo "commit=${GITHUB_SHA::7}"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the AppImage and the .deb working on older distributions.
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
          # The MSI installer does not take a version like 0.3.0-beta.1, so Windows gets NSIS.
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    env:
      CHORD_VERSION: ${{ needs.version.outputs.version }}
      CHORD_KLIPY_KEY: ${{ secrets.CHORD_KLIPY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chord-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        working-directory: chord-desktop
        shell: bash
        run: |
          npm ci
          npx tauri build --bundles "${{ matrix.bundles }}" --config "{\"version\":\"$CHORD_VERSION\"}"
      - name: Collect the bundles
        shell: bash
        run: |
          mkdir dist
          find target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*-setup.exe' -o -name '*.dmg' \) -exec cp {} dist/ \;
          ls -l dist
          [[ -n "$(ls dist)" ]]
      - uses: actions/upload-artifact@v4
        with:
          name: chord-desktop-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to abbyfluoroethane/chord-desktop
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          BETA: ${{ needs.version.outputs.beta }}
          COMMIT: ${{ needs.version.outputs.commit }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ -n "$GH_TOKEN" ]] || { echo "::error::The RELEASES_TOKEN secret is missing."; exit 1; }
          cd dist
          sha256sum -- * > SHA256SUMS
          release_tag="v$VERSION"; flags=(--latest)
          if [[ "$BETA" == true ]]; then release_tag="v$VERSION+$COMMIT"; flags=(--prerelease); fi
          # The notes are the message of the annotated tag that dev/release.sh made.
          git -C .. for-each-ref --format='%(contents:body)' "refs/tags/$TAG" > ../notes.md
          {
            echo
            echo "Linux: .AppImage, .deb or .rpm. Windows: the -setup.exe. macOS: the .dmg."
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> ../notes.md
          gh release create "$release_tag" -R abbyfluoroethane/chord-desktop \
            --title "Chord Desktop $VERSION" --notes-file ../notes.md "${flags[@]}" ./*
