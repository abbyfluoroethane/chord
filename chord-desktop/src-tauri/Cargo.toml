[package]
name = "chord-desktop"
description = "Chord Desktop: the Tauri app on chord-core."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The _lib suffix keeps the lib name apart from the bin name (a Windows issue,
# rust-lang/cargo#8519).
name = "chord_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Desktop notifications for ClientEvent::Notification (src/notify.rs).
tauri-plugin-notification = "2"
# The system file dialog for the upload button. It gives the bridge a real file path.
tauri-plugin-dialog = "2"
# The Chord core with its JSON output (Serialize on the views and events).
chord-core = { workspace = true, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log.workspace = true
# Decodes the path of a chord-avatar:// request.
percent-encoding = "2"
# The avatar store reads the database with its own connection (src/avatars.rs).
rusqlite.workspace = true
# Link previews (src/link_preview.rs): the HTTP fetch, with rustls as in chord-core.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# The DNS lookup of the SSRF filter, and the per-URL lock.
tokio = { workspace = true, features = ["net", "sync"] }
# Parses the URL, and resolves a relative image URL against the page.
url = "2"
# html5ever based HTML parser and selectors, for the Open Graph tags.
scraper = "0.23"

# The system keychain for the saved password (src/keychain.rs). Each platform names its
# own store. A target with no store feature would fall back to a mock store that keeps
# nothing, so do not use a bare `keyring = "3"`.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# No [profile] here: the workspace root sets the profiles, with panic = "unwind".
# Never set panic = "abort" (see the root Cargo.toml).
