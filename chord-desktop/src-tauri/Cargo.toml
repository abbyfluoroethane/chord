[package]
name = "chord-desktop"
description = "Chord Desktop: the Tauri app on chord-core."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The _lib suffix keeps the lib name apart from the bin name (a Windows issue,
# rust-lang/cargo#8519).
name = "chord_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# The xmpp: link handler (src/links.rs). The scheme goes into the app bundle with the config
# in tauri.conf.json.
tauri-plugin-deep-link = "2"
# Desktop notifications for ClientEvent::Notification (src/notify.rs).
tauri-plugin-notification = "2"
# The local time for the quiet hours of a notice (src/notify.rs).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The system file dialog. Rust opens it (src/files.rs), so the page needs no permission for it.
tauri-plugin-dialog = "2"
# O_NOFOLLOW and ELOOP for the file gate (src/files.rs). Already in the tree through tauri.
libc = "0.2"
# The Chord core with its JSON output (Serialize on the views and events).
chord-core = { workspace = true, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log.workspace = true
# Decodes the path of a chord-avatar:// request.
percent-encoding = "2"
# The avatar store reads the database with its own connection (src/avatars.rs).
rusqlite.workspace = true
# Link previews (src/link_preview.rs): the HTTP fetch, with rustls as in chord-core.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# The DNS lookup of the SSRF filter, and the per-URL lock.
tokio = { workspace = true, features = ["net", "sync", "rt-multi-thread"] }
# Parses the URL, and resolves a relative image URL against the page.
url = "2"
# html5ever based HTML parser and selectors, for the Open Graph tags.
scraper = "0.23"
# Emoji packs (src/emoji.rs): read the npm tarball, and check its SHA-512.
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
base64 = "0.22"
# Shrinks a big avatar or preview image before it reaches the webview (src/thumb.rs). Only
# the png and jpeg codecs: a gif or webp may be animated, so the code passes those through.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Draws a heavy emoji SVG (filters, big gradients) to a PNG once (src/emoji.rs). WebKit draws
# SVG filters on the main thread, so a picker full of Fluent emoji hung the app. No text and
# no system fonts: emoji SVGs have only shapes.
resvg = { version = "0.48", default-features = false }

# One running app. On Windows and Linux the OS starts a second copy for an xmpp: link. The
# `deep-link` feature passes the link to the first copy, which then gets the link event.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# The system keychain for the saved password (src/keychain.rs). Each platform names its
# own store. A target with no store feature would fall back to a mock store that keeps
# nothing, so do not use a bare `keyring = "3"`.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
# #[tokio::test] for the resolver tests in src/link_preview.rs.
tokio = { workspace = true, features = ["macros", "rt"] }

# No [profile] here: the workspace root sets the profiles, with panic = "unwind".
# Never set panic = "abort" (see the root Cargo.toml).
