<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chord</title>
    <style>
      /* The first paint. The Svelte splash takes over when the app mounts. */
      html,
      body {
        margin: 0;
        background: #111316;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #111316;
        color: #ece8e1;
      }
      #boot-splash svg {
        animation: boot-pulse 2400ms cubic-bezier(0.2, 0, 0, 1) infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }
      @media (prefers-color-scheme: light) {
        html,
        body,
        #boot-splash {
          background: #f6f4ef;
          color: #1a1c20;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash svg {
          animation: none;
        }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="boot-splash" aria-hidden="true">
      <svg width="72" height="72" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="22" fill="none" stroke="currentColor" stroke-width="4" />
        <line x1="11.3" y1="39.5" x2="39.5" y2="11.3" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
        <circle cx="11.3" cy="39.5" r="5" fill="currentColor" />
        <circle cx="39.5" cy="11.3" r="5" fill="currentColor" />
      </svg>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
